aid: goin
name: Goin
description: >-
  Goin is a European consumer fintech platform, backed by Anthemis and based in
  Barcelona, Spain, that helps more than 700,000 users across Europe grow their
  money and spend less. The app bundles automated savings (fixed daily, weekly or
  monthly rules and goal-based portfolios), investing, buying and selling of
  cryptocurrencies, cashback and rewards at hundreds of online and physical
  stores, gift cards and coupons, and a browser extension that surfaces discounts
  while shopping. Bank accounts are connected securely under Europe's PSD2 open
  banking regulation, and a referral program rewards users for inviting friends.
  Goin is a business-to-consumer mobile product distributed through the Apple App
  Store and Google Play; it does not publish a public developer program, API, or
  documentation surface. This API Evangelist profile tracks Goin as a portfolio
  lead and captures its public web, help, and legal presence.
